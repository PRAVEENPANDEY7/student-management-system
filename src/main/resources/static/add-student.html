<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register As Student - Prayag Institute of Technology and Management</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="site-page">
<main class="site-shell narrow-shell">
  <header class="topbar portal-topbar">
    <div>
      <span class="eyebrow">Student Registration</span>
      <h1>Register As Student</h1>
      <p class="topbar-copy">Fill the form, review the details, edit if required, and then save to the database.</p>
    </div>
    <div class="action-row">
      <a class="btn btn-soft btn-inline" href="http://localhost:8083/index.html">Back To Home</a>
    </div>
  </header>

  <section class="auth-card standalone-card">
    <div id="form-message" class="status-banner" hidden></div>
    <form id="student-add-form" class="form-stack" method="post" action="http://localhost:8083/web/register/student">
      <div class="input-group">
        <label for="student-name">Full Name</label>
        <input type="text" id="student-name" name="name" placeholder="Student full name" required>
      </div>
      <div class="input-row">
        <div class="input-group">
          <label for="student-email">Email</label>
          <input type="email" id="student-email" name="email" placeholder="student@email.com" required>
        </div>
        <div class="input-group">
          <label for="student-age">Age</label>
          <input type="number" id="student-age" name="age" min="1" placeholder="Age" required>
        </div>
      </div>
      <div class="input-row">
        <div class="input-group">
          <label for="student-course">Course</label>
          <input type="text" id="student-course" name="course" placeholder="Course" required>
        </div>
        <div class="input-group">
          <label for="student-username">Username</label>
          <input type="text" id="student-username" name="username" placeholder="Username" required>
        </div>
      </div>
      <div class="input-group">
        <label for="student-password">Password</label>
        <input type="password" id="student-password" name="password" minlength="6" placeholder="Password" required>
      </div>
      <button type="submit" class="btn btn-primary">Review Details</button>
    </form>

    <section id="review-card" class="review-card" hidden>
      <h2>Review Student Details</h2>
      <div id="review-content" class="review-grid"></div>
      <div class="action-row review-actions">
        <button id="edit-button" class="btn btn-soft btn-inline" type="button">Edit Details</button>
        <button id="confirm-button" class="btn btn-primary btn-inline" type="button">Save To Database</button>
      </div>
    </section>
  </section>
</main>

<script src="forms.js"></script>
</body>
</html>
