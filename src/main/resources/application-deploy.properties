spring.application.name=StudentManagementSystem

# Deployment profile. Uses H2 by default so the app can start on Docker hosts
# without a separately provisioned MySQL service.
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:/tmp/student-management-system;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=${DATABASE_DRIVER:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}

jwt.secret=${JWT_SECRET:change-this-secret-before-production}
jwt.expiration=${JWT_EXPIRATION:86400000}

server.port=${PORT:8083}
